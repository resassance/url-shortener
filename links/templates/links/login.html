{% extends 'links/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow border-0" style="border-radius: 15px;">
            <div class="card-body p-4">
                <h2 class="text-center mb-4 fw-bold">Вход</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold mt-3" style="border-radius: 10px;">
                        Войти
                    </button>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted small">Нет аккаунта? <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
